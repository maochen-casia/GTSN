[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtsn"
version = "0.1.0"
description = "Geometry-grounded RGB navigation with persistent memory, embodiment and uncertainty"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0", "numpy==1.26.4", "h5py==3.14.0",
  "sapien==3.0.3", "mani-skill==3.0.1", "trimesh==4.6.8",
  "PyOpenGL==3.1.10", "freetype-py==2.5.1", "pyglet==1.5.31",
  "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "Pillow==11.3.0",
  "huggingface-hub==0.36.0", "safetensors==0.6.2",
  "networkx==3.4.2", "scipy==1.15.3", "six==1.17.0",
]

[project.scripts]
tsn-train = "tsn.cli.train:main"
tsn-evaluate = "tsn.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
